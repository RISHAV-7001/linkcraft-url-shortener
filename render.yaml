services:
  - type: web
    name: linkcraft-url-shortener
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Optional: configure SAFE_BROWSING_API_KEY in Render Environment settings.
      # RENDER_EXTERNAL_URL is provided by Render and sets the public link domain.
