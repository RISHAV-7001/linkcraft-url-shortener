services:
  - type: web
    name: linkcraft-url-shortener
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: linkcraft-url-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Optional: add SAFE_BROWSING_API_KEY later in the Render Environment page.
      # RENDER_EXTERNAL_URL is supplied automatically by Render and used for links.
